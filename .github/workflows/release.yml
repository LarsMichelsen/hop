name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dedicated environment so the PyPI trusted publisher can be pinned to it,
    # limiting what other workflows in this repo could publish.
    environment: pypi
    permissions:
      # Create the GitHub Release.
      contents: write
      # Mint the OIDC token for PyPI trusted publishing (no API token needed;
      # the publisher is configured on pypi.org for this repo + workflow).
      id-token: write
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from `git describe`; a shallow,
          # tagless checkout would break it.
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # The tag may have been pushed without waiting for CI on the commit;
      # never publish an artifact that does not pass the full check suite.
      - name: Run all checks
        run: uv run prek run --all-files --show-diff-on-failure

      - name: Build sdist and wheel
        run: uv build

      # The version is derived from the tag; if the artifacts carry anything
      # else (e.g. a .dev version), something about the tag or checkout is
      # wrong — refuse to publish it.
      - name: Verify the tag produced the release version
        run: test -f "dist/git_hop-${GITHUB_REF_NAME#v}-py3-none-any.whl"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # --generate-notes builds notes from merged PRs, which this repo's
      # direct-push workflow never produces; derive them from the commit
      # subjects since the previous tag instead.
      - name: Generate release notes from commits
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Changes"
            git log --format='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME"
            echo
            if [ -n "$prev" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            else
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
            fi
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag --notes-file release-notes.md
